# Reverse proxy configuration for Open WebUI
# WebSocket support is critical for AI model downloading and chat streams

location __PATH__/ {

    # Proxy to the internal Open WebUI server
    proxy_pass http://127.0.0.1:__PORT__;

    # Inform the backend about the original host
    proxy_set_header Host $host;

    # Forward the real client IP
    proxy_set_header X-Real-IP $remote_addr;

    # Forward the original protocol (http/https)
    proxy_set_header X-Forwarded-Proto $scheme;

    # Forward the original path (without __PATH__)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # WebSocket support - CRITICAL for chat streams and model downloads
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeout settings for long-running AI operations
    proxy_read_timeout 86400;
    proxy_connect_timeout 86400;
    proxy_send_timeout 86400;

    # Increase body size limit for model uploads
    client_max_body_size 10G;

    # Disable buffering for streaming responses
    proxy_buffering off;
    proxy_cache off;

    # SSOwat/LDAP header passthrough - pass authenticated user's identity
    proxy_set_header Remote-User $remote_user;
    proxy_set_header Remote-Email $remote_user;

    # WebSocket ping/pong for connection keepalive
    proxy_http_version 1.1;
}